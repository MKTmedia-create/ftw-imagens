name: Inventario dos links
on:
  push:
    branches: [migracao]
    paths: ['scripts/inventario.py', 'dados/links_origem.csv', '.github/workflows/inventario.yml']
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - run: python scripts/inventario.py
      - name: Salvar relatorio
        run: |
          git config user.name "ftw-imagens-bot"
          git config user.email "ftw-imagens-bot@users.noreply.github.com"
          git add dados/inventario.json dados/inventario_links.json
          git commit -m "Inventario dos links [skip ci]"
          git pull --rebase origin migracao
          git push origin migracao
