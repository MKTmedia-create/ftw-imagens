const TOPIC='ftw-esteira-z9bz6hs56s';
const $=id=>document.getElementById(id);
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const EC={name:'ECDH',namedCurve:'P-256'};
function lucky(id){let h=2166136261>>>0;for(const ch of String(id)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return String(100000+(h%900000));}
async function tryKey(jwk){
  const priv=await crypto.subtle.importKey('jwk',jwk,EC,false,['deriveKey']);
  const out=[];
  for(const m of MSGS){
    try{const epk=await crypto.subtle.importKey('raw',ub64(m.epk),EC,false,[]);
      const k=await crypto.subtle.deriveKey({name:'ECDH',public:epk},priv,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(m.iv)},k,ub64(m.ct));
      out.push({m,d:JSON.parse(new TextDecoder().decode(pt))});}catch(e){}
  }
  return out;
}
function csv(rows){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['numero_sorte','nome_completo','whatsapp','email','indicacao_nome','indicacao_whatsapp','cadastro_em'];
  const lines=[head.join(';')].concat(rows.map(({m,d})=>[lucky(m.id),d.nome,d.wpp,d.email,d.anome||'',d.awpp||'',new Date(m.time*1000).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'})].map(q).join(';')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadastros-sexta-manha-recuperados.csv';a.click();
}
(async()=>{

})();
