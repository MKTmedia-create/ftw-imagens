<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Desafio Esteira — FTW Suplementos</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#0a0a0a;color:#f5f5f5;font-family:Inter,system-ui,sans-serif;
    background-image:radial-gradient(ellipse at 50% 0%, rgba(227,6,19,.28), transparent 60%);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:420px}
  .brand{font-weight:800;letter-spacing:.3em;font-size:11px;color:#ff2a36;text-transform:uppercase}
  h1{font-family:Anton,sans-serif;font-weight:400;font-size:46px;line-height:1;margin:10px 0 8px;text-transform:uppercase}
  .sub{color:#9a9a9a;font-size:15px;line-height:1.5;margin-bottom:26px}
  .sub b{color:#fff}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#9a9a9a;margin:16px 0 8px}
  input[type=text]{width:100%;background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:16px;color:#fff;font-size:18px;font-family:inherit;outline:none}
  input[type=text]:focus{border-color:#e30613}
  .chk{text-transform:none;letter-spacing:0;display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13px;color:#9a9a9a;line-height:1.45}
  .chk input{margin-top:3px;width:18px;height:18px;accent-color:#e30613;flex:none}
  button{width:100%;margin-top:24px;background:#e30613;color:#fff;border:none;border-radius:99px;padding:18px;font-family:Anton,sans-serif;font-size:22px;letter-spacing:.05em;cursor:pointer}
  button:disabled{background:#333;color:#777}
  .err{color:#ff6b73;font-size:14px;margin-top:12px;min-height:18px}
  .ok{display:none;text-align:center}
  .ok .big{font-family:Anton,sans-serif;font-size:56px;line-height:1;margin:16px 0}
  .ok p{color:#bbb;font-size:16px;line-height:1.5}
  .ok .nm{color:#ff2a36;font-weight:800}
  .again{background:transparent;border:1px solid #333;color:#bbb;font-family:Inter,sans-serif;font-size:14px;padding:12px}
  .foot{margin-top:28px;text-align:center;color:#555;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <form id="f" autocomplete="off">
    <div class="brand">FTW Suplementos</div>
    <h1>Desafio<br>Esteira</h1>
    <p class="sub">Corra <b id="dist">a distância</b> no menor tempo e entre para o ranking. Cadastre seu nome e acompanhe sua vez na TV.</p>

    <label for="nome">Seu nome (aparece na TV)</label>
    <input type="text" id="nome" maxlength="24" placeholder="Ex.: Mariana Souza" required>

    <label for="ig">Instagram (opcional)</label>
    <input type="text" id="ig" maxlength="30" placeholder="@seuperfil" autocapitalize="off">

    <label class="chk"><input type="checkbox" id="ok"> <span>Autorizo exibir meu nome e meu tempo no ranking do evento e o uso dessas informações pela FTW Suplementos para contato sobre a ação.</span></label>

    <button type="submit" id="go">ENTRAR NA FILA</button>
    <div class="err" id="err"></div>
  </form>

  <div class="ok" id="done">
    <div class="brand">FTW Suplementos</div>
    <div class="big">VOCÊ ESTÁ<br>NA FILA!</div>
    <p>Fica de olho na TV, <span class="nm" id="nmOk"></span>.<br>Quando seu nome aparecer, é sua vez na esteira.</p>
    <button class="again" id="again">Cadastrar outra pessoa</button>
  </div>
  <div class="foot">Feito para vencer</div>
</div>
<script>
  const qs = new URLSearchParams(location.search);
  const topic = (qs.get('e') || '').replace(/[^a-zA-Z0-9_-]/g,'');
  const dist = qs.get('d'); if (dist) document.getElementById('dist').textContent = dist;
  const $ = id => document.getElementById(id);
  if (!topic){ $('go').disabled = true; $('err').textContent = 'QR inválido. Peça ajuda à equipe no estande.'; }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const nome = $('nome').value.replace(/\s+/g,' ').trim();
    const ig = $('ig').value.trim().replace(/^@/,'').replace(/\s/g,'');
    if (nome.length < 2){ $('err').textContent = 'Digite seu nome.'; return; }
    if (!$('ok').checked){ $('err').textContent = 'Marque a autorização para participar do ranking.'; return; }
    $('go').disabled = true; $('go').textContent = 'ENVIANDO…'; $('err').textContent = '';
    try{
      const r = await fetch('https://ntfy.sh/' + topic, { method:'POST', body: JSON.stringify({ t:'cad', nome, ig }) });
      if (!r.ok) throw new Error(r.status);
      $('nmOk').textContent = nome.split(' ')[0];
      $('f').style.display='none'; $('done').style.display='block';
    }catch(err){
      $('err').textContent = 'Não conseguimos enviar. Verifique sua internet e tente de novo.';
    }finally{
      $('go').disabled = false; $('go').textContent = 'ENTRAR NA FILA';
    }
  });
  $('again').onclick = () => { $('f').reset(); $('done').style.display='none'; $('f').style.display='block'; };
</script>
</body>
</html>
