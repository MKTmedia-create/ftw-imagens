<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232323">
<title>Desafio Esteira — Cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400..700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#141414;--bar:#232323;--grey:#dbdbdb;--mute:#8e8e8e;--lime:#aaf890;--lav:#9d9dfb;--orange:#fd5d36;
    --ease:cubic-bezier(.32,.72,0,1);--narrow:"Archivo Narrow",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--ink)}
  body{min-height:100dvh;color:var(--grey);font-family:var(--mono);font-size:14px;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(219,219,219,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(219,219,219,.07) 1px,transparent 1px);
    background-size:64px 64px;display:flex;flex-direction:column}
  .top{background:var(--bar);padding:calc(14px + env(safe-area-inset-top)) 20px 14px;display:flex;justify-content:space-between;align-items:center;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .top b{font-family:var(--narrow);font-size:15px;color:var(--lime);letter-spacing:.01em}
  .sq{width:7px;height:7px;background:var(--grey);display:inline-block;margin-right:8px}
  main{flex:1;width:100%;max-width:460px;margin:0 auto;padding:32px 20px calc(32px + env(safe-area-inset-bottom));position:relative}
  .pix{display:grid;grid-template-columns:repeat(4,9px);margin-bottom:22px}
  .pix i{width:9px;height:9px}
  .pix i:nth-child(-n+4):nth-child(odd),.pix i:nth-child(n+5):nth-child(even){background:var(--lav)}
  .tag{display:inline-block;background:var(--lime);color:#000;font-family:var(--narrow);font-weight:700;font-size:15px;text-transform:uppercase;padding:3px 8px}
  h1{font-family:var(--narrow);font-weight:700;text-transform:uppercase;font-size:clamp(52px,17vw,78px);line-height:.86;color:#f2f2f2;margin:14px 0 18px;letter-spacing:-.01em}
  .lead{line-height:1.6;color:var(--grey);max-width:34ch}
  .lead b{background:var(--lime);color:#000;padding:0 4px;font-weight:700}
  form{margin-top:30px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:20px 0 8px}
  input[type=text]{width:100%;background:var(--bar);border:1px solid #3a3a3a;border-radius:0;padding:16px;color:#fff;font-family:var(--narrow);font-weight:700;font-size:22px;text-transform:uppercase;outline:none;
    transition:border-color .4s var(--ease)}
  input#ig{font-family:var(--mono);font-weight:400;font-size:16px;text-transform:none}
  input[type=text]::placeholder{color:#555}
  input[type=text]:focus{border-color:var(--lime)}
  .chk{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:12px;line-height:1.55;color:var(--mute);cursor:pointer;text-transform:none;letter-spacing:0}
  .chk input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1px solid #555;background:var(--bar);margin-top:1px;cursor:pointer;display:grid;place-items:center;transition:background .3s var(--ease)}
  .chk input:checked{background:var(--lime);border-color:var(--lime)}
  .chk input:checked::after{content:"";width:8px;height:8px;background:#000}
  .go{display:block;width:calc(100% - 12px);margin:30px 0 0 6px;border:none;background:none;padding:0;height:64px;cursor:pointer}
  .go span{display:flex;align-items:center;justify-content:center;gap:12px;height:100%;background:var(--lime);color:#000;transform:skewX(-14deg);transition:transform .5s var(--ease),background .4s var(--ease)}
  .go span > *{transform:skewX(14deg)}
  .go em{font-style:normal;font-family:var(--narrow);font-weight:700;font-size:24px;text-transform:uppercase}
  .go svg{width:20px;height:20px}
  .go:active span{transform:skewX(-14deg) scale(.97)}
  .go:disabled span{background:#2e2e2e;color:#777}
  .err{color:var(--orange);font-size:13px;margin-top:14px;min-height:20px;line-height:1.45}
  :focus-visible{outline:2px solid var(--lav);outline-offset:3px}

  .done{position:fixed;inset:0;background:var(--lime);color:#000;display:flex;flex-direction:column;justify-content:center;padding:28px;
    opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .5s var(--ease),transform .8s var(--ease)}
  .done.on{opacity:1;pointer-events:auto;transform:none}
  .done h2{font-family:var(--narrow);font-weight:700;text-transform:uppercase;font-size:clamp(60px,20vw,96px);line-height:.84;letter-spacing:-.01em}
  .done p{font-size:15px;line-height:1.6;margin-top:22px;max-width:30ch}
  .done p b{font-weight:700}
  .done .again{margin-top:34px;align-self:flex-start;background:#000;color:var(--lime);border:none;padding:14px 20px;font-family:var(--narrow);font-weight:700;font-size:16px;text-transform:uppercase;cursor:pointer}
  .done .hud{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:right}
  .done .hud i{display:block;width:8px;height:8px;background:#000;margin:0 0 6px auto}
</style>
</head>
<body>
<div class="top"><span><span class="sq"></span>Desafio na esteira</span><b>We do hard things</b></div>
<main>
  <div class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <span class="tag">Inscrição</span>
  <h1 id="title">Desafio Esteira</h1>
  <p class="lead">Corra <b id="dist">a distância</b> no menor tempo e entre no ranking. Cadastre seu nome e acompanhe sua vez na TV.</p>

  <form id="f" autocomplete="off" novalidate>
    <label for="nome">Seu nome (aparece na TV)</label>
    <input type="text" id="nome" maxlength="24" placeholder="Mariana Souza" autocapitalize="words" enterkeyhint="next">

    <label for="ig">Instagram (opcional)</label>
    <input type="text" id="ig" maxlength="30" placeholder="@seuperfil" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">

    <label class="chk"><input type="checkbox" id="ok"><span>Autorizo exibir meu nome e meu tempo no ranking do evento e o uso desses dados pela FTW Suplementos para contato sobre a ação.</span></label>

    <button type="submit" class="go" id="go"><span><em>Entrar na fila</em><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12h15M13 5l7 7-7 7"/></svg></span></button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<section class="done" id="done" aria-live="polite">
  <div class="hud"><i></i>Cadastro<br>confirmado</div>
  <h2>Você está<br>na fila</h2>
  <p>Fica de olho na TV, <b id="nmOk"></b>. Quando seu nome aparecer, é sua vez na esteira.</p>
  <button class="again" id="again">Cadastrar outra pessoa</button>
</section>

<script>
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const topic = (qs.get('e') || '').replace(/[^a-zA-Z0-9_-]/g,'');
  if (qs.get('d')) $('dist').textContent = qs.get('d');
  if (qs.get('t')){ $('title').textContent = qs.get('t'); document.title = qs.get('t') + ' — Cadastro'; }
  const btnLabel = $('go').querySelector('em');
  if (!topic){ $('go').disabled = true; $('err').textContent = 'Este QR não está ligado a nenhum desafio. Peça ajuda à equipe no estande.'; }

  $('nome').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('ig').focus(); } });
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const nome = $('nome').value.replace(/\s+/g,' ').trim();
    const ig = $('ig').value.trim().replace(/^@/,'').replace(/\s/g,'');
    if (nome.length < 2){ $('err').textContent = 'Digite seu nome para entrar na fila.'; $('nome').focus(); return; }
    if (!$('ok').checked){ $('err').textContent = 'Marque a autorização para aparecer no ranking.'; return; }
    $('go').disabled = true; btnLabel.textContent = 'Enviando'; $('err').textContent = '';
    try{
      const r = await fetch('https://ntfy.sh/' + topic, { method:'POST', body: JSON.stringify({ t:'cad', nome, ig }) });
      if (!r.ok) throw new Error(r.status);
      $('nmOk').textContent = nome.split(' ')[0];
      $('done').classList.add('on');
    }catch(err){
      $('err').textContent = 'O cadastro não foi enviado. Confira sua internet e toque em "Entrar na fila" de novo.';
    }finally{
      $('go').disabled = false; btnLabel.textContent = 'Entrar na fila';
    }
  });
  $('again').onclick = () => { $('f').reset(); $('done').classList.remove('on'); window.scrollTo(0,0); };
</script>
</body>
</html>
