<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Banco de Imagens FTW Suplementos</title>
<style>
@font-face{font-family:Archivo;src:url(vendor/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --piso:#DFE2E6; --papel:#FFFFFF; --tinta:#16191E; --apoio:#5A616B; --linha:#C4C9D0;
  --ftw:#D5001F; --dv:#00853E; --del:#7A3E1D; --ace:#3C4450; --marca:var(--tinta);
  --aviso-fundo:#FFF1C9; --aviso-tinta:#5B4300;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--piso);color:var(--tinta);font:400 16px/1.45 Archivo,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.topo{padding:18px 24px 0}
.barra{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.barra h1{margin:0;font-size:16px;font-weight:600}
.barra small{color:var(--apoio);font-size:14px;margin-left:10px}
.planilha{background:none;border:0;padding:0;font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;color:var(--tinta)}

.busca{display:flex;align-items:flex-end;gap:20px;margin-top:14px;border-bottom:4px solid var(--marca)}
.busca input{flex:1;min-width:0;border:0;background:none;outline:0;padding:0 0 4px;
  font-size:clamp(31px,7.4vw,104px);line-height:1.02;font-weight:800;font-stretch:66%;letter-spacing:-.01em}
.busca input::placeholder{color:#9AA1AB;opacity:1}
.busca input::-webkit-search-cancel-button{display:none}
.conta{flex:none;text-align:right;padding-bottom:12px;white-space:nowrap;color:var(--apoio);font-size:15px}
.conta b{display:block;color:var(--tinta);font-size:clamp(24px,3vw,40px);line-height:1;font-weight:800;font-stretch:70%;font-variant-numeric:tabular-nums}

.filtros{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:12px 0 14px}
.marcas{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.marcas button{border:0;background:none;padding:6px 12px;border-radius:2px;font-weight:600;font-size:15px}
.marcas button span{font-weight:400;color:var(--apoio);margin-left:5px;font-variant-numeric:tabular-nums}
.marcas button:hover{background:#D0D4DA}
.marcas button[aria-pressed=true]{background:var(--marca);color:#fff}
.marcas button[aria-pressed=true] span{color:#ffffffcc}
.linhas h2{margin:14px 0 3px;padding-left:11px;font-size:20px;line-height:1.1;font-weight:800;font-stretch:66%}
.linhas h2:first-child{margin-top:0}
.antigas{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--apoio);cursor:pointer}
.antigas input{width:18px;height:18px;accent-color:var(--tinta);margin:0}

.corpo{display:grid;grid-template-columns:232px minmax(0,1fr);gap:0 24px;padding:0 24px 56px;align-items:start}
.linhas{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:0 6px 0 0;scrollbar-width:thin}
.linhas button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:4px 8px;font-size:15px;line-height:1.3;border-left:3px solid transparent}
.linhas button span{color:var(--apoio);font-variant-numeric:tabular-nums}
.linhas button:hover{background:#D0D4DA}
.linhas button[aria-pressed=true]{font-weight:700;border-left-color:var(--marca)}
.seletor{display:none;width:100%;padding:10px;border:1px solid var(--linha);background:var(--papel);margin-bottom:12px;border-radius:2px}

.marca-tit{grid-column:1/-1;margin:22px 0 2px;font-size:30px;line-height:1.1;font-weight:800;font-stretch:66%;}
.marca-tit:first-child{margin-top:0}
.folha{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:18px 14px;align-items:start}
.card{display:block;width:100%;border:0;padding:0;background:none;text-align:left;--c:var(--tinta)}
.card .foto{display:block;position:relative;aspect-ratio:1;background:var(--papel);overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:contain}
.ticks{position:absolute;left:6px;right:6px;bottom:5px;display:flex;gap:2px;height:3px}
.ticks i{flex:1;background:#00000018}
.ticks i.on{background:var(--c)}
.card .nome{display:block;margin-top:7px;font-size:17px;line-height:1.14;font-weight:700;font-stretch:78%}
.card .info{display:block;margin-top:2px;font-size:14px;color:var(--apoio)}
.card:hover .nome{text-decoration:underline;text-underline-offset:2px}
.selo{display:inline-block;font-size:13px;line-height:1.3;padding:0 6px;font-weight:600;border-radius:2px;background:#fff;color:var(--tinta);border:1px solid var(--linha)}
.selo.velho{background:var(--aviso-fundo);color:var(--aviso-tinta);border-color:#E7CE82}
.vazio{padding:40px 0;max-width:46ch;font-size:18px}
.vazio b{display:block;font-size:30px;line-height:1.1;font-weight:800;font-stretch:66%;margin-bottom:6px}
.vazio button{margin-top:12px;background:var(--tinta);color:#fff;border:0;padding:9px 14px;font-weight:600;border-radius:2px}

dialog{border:0;padding:0;margin:0 0 0 auto;width:min(760px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;background:var(--papel);color:var(--tinta);overflow:auto}
dialog::backdrop{background:rgba(22,25,30,.55)}
.pn{display:flex;flex-direction:column;min-height:100%}
.pn-topo{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;padding:18px 22px 10px}
.pn-topo h2{margin:0;font-size:clamp(28px,4.2vw,42px);line-height:1.02;font-weight:800;font-stretch:66%}
.pn-topo p{margin:5px 0 0;color:var(--apoio);font-size:15px}
.fechar{flex:none;border:1px solid var(--linha);background:none;padding:6px 12px;font-weight:600;border-radius:2px}
.aviso{margin:0 22px 10px;padding:8px 12px;background:var(--aviso-fundo);color:var(--aviso-tinta);font-size:15px;border-radius:2px}
.palco{position:relative;margin:0 22px;background:var(--papel);aspect-ratio:1;max-height:56vh;width:calc(100% - 44px)}
.palco img{width:100%;height:100%;object-fit:contain;display:block}
.tiras{display:flex;gap:6px;overflow-x:auto;padding:10px 22px;scrollbar-width:thin}
.tiras button{flex:none;width:68px;height:68px;padding:0;border:2px solid var(--piso);background:var(--papel)}
.tiras button img{width:100%;height:100%;object-fit:contain;display:block}
.tiras button[aria-current=true]{border-color:var(--marca)}
.acoes{padding:2px 22px 10px}
.acoes h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--apoio);overflow-wrap:anywhere}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:block;width:100%;padding:10px 12px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);text-decoration:none;text-align:left;font-weight:700;line-height:1.2;border-radius:2px}
.btn small{display:block;font-weight:400;font-size:13.5px;color:var(--apoio);margin-top:2px}
.btn.forte{background:var(--tinta);color:#fff}
.btn.forte small{color:#ffffffc7}
.btn:hover{border-color:var(--marca);box-shadow:inset 0 0 0 1px var(--marca)}
.btn[disabled]{opacity:.6;cursor:progress}
.todas{margin-top:auto;border-top:1px solid var(--linha);padding:12px 22px 22px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:9px 16px;border-radius:2px;font-weight:600;z-index:10;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (max-width:900px){
  .topo{padding:14px 16px 0}
  .barra small{display:block;margin:0}
  .corpo{display:block;padding:0 16px 40px}
  .linhas{display:none}
  .seletor{display:block}
  .folha{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .btns{grid-template-columns:1fr}
  .marcas{overflow-x:auto;flex-wrap:nowrap;max-width:100%}
  .marcas button{white-space:nowrap}
  .pn-topo,.tiras,.acoes,.todas{padding-left:16px;padding-right:16px}
  .palco{margin:0 16px;width:calc(100% - 32px)}
  .aviso{margin-left:16px;margin-right:16px}
  .conta{padding-bottom:8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body data-marca="">
<header class="topo">
  <div class="barra">
    <h1>Banco de imagens FTW Suplementos<small id="atualizado"></small></h1>
    <a class="planilha" href="links_novos.csv" download>Baixar planilha de links</a>
  </div>
  <label class="busca">
    <span class="sr">Buscar imagens</span>
    <input id="q" type="search" placeholder="Buscar produto ou sabor" autocomplete="off" spellcheck="false" autofocus>
    <span class="conta" aria-live="polite"><b id="n-img">0</b><span id="n-rot">imagens</span></span>
  </label>
  <div class="filtros">
    <ul class="marcas" id="marcas"></ul>
    <label class="antigas"><input type="checkbox" id="antigas"> Mostrar embalagens antigas</label>
  </div>
</header>
<main class="corpo">
  <nav class="linhas" id="linhas" aria-label="Linhas de produto"></nav>
  <div>
    <label class="sr" for="seletor">Linha de produto</label>
    <select class="seletor" id="seletor"></select>
    <div id="resultado"></div>
  </div>
</main>
<dialog id="painel" aria-labelledby="pn-tit"><div class="pn" id="pn"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cores = {FTW:'--ftw', DiaboVerde:'--dv', Delicious:'--del', Acessorios:'--ace'};
const fmtN = n => n.toLocaleString('pt-BR');
const fmtB = b => !b ? '' : b >= 1e6 ? (b/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' MB' : Math.round(b/1e3) + ' KB';
const site = (g, it) => `produtos/${g.p}/${it.a}`;
const mini = (g, it) => `miniaturas/${g.p}/${it.a.replace(/\.[^.]+$/, '')}.webp`;
const abs = rel => new URL(rel, location.href).href;
let CAT, est = {q:'', marca:'', linha:'', antigas:false};

function aviso(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(()=>el.classList.remove('on'),2200)}

async function carregar(){
  try{
    const r = await fetch('catalogo.json', {cache:'no-cache'});
    if(!r.ok) throw 0;
    CAT = await r.json();
  }catch(e){
    $('#resultado').innerHTML = '<div class="vazio"><b>O catálogo não carregou.</b>Recarregue a página. Se continuar, avise o time de Criação.</div>';
    return;
  }
  CAT.grupos.forEach(g => g.busca = sem([g.n, g.l, CAT.rotulos[g.m], g.p.replace(/[_/-]/g,' '), g.v].join(' ')));
  const d = new Date(CAT.gerado);
  $('#atualizado').textContent = 'atualizado em ' + d.toLocaleDateString('pt-BR') + ', ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  render();
  abrirDoHash();
}

const visiveis = () => {
  const toks = sem(est.q).split(/\s+/).filter(Boolean);
  return CAT.grupos.filter(g => (est.antigas || g.v !== 'antigo') && toks.every(t => g.busca.includes(t)));
};

function render(){
  const base = visiveis();
  const porMarca = {}; base.forEach(g => porMarca[g.m] = (porMarca[g.m]||0) + g.i.length);
  const contaTotal = base.reduce((s,g) => s + g.i.length, 0);
  const marcas = [['', 'Todas', contaTotal], ...Object.keys(CAT.rotulos).map(m => [m, CAT.rotulos[m], porMarca[m]||0])];
  $('#marcas').innerHTML = marcas.map(([m,r,n]) => `<li><button data-m="${m}" aria-pressed="${est.marca===m}">${esc(r)}<span>${fmtN(n)}</span></button></li>`).join('');
  document.body.style.setProperty('--marca', est.marca ? `var(${cores[est.marca]})` : 'var(--tinta)');

  const noMarca = base.filter(g => !est.marca || g.m === est.marca);
  const linhas = {}; noMarca.forEach(g => { const k = (est.marca?'':g.m+'|')+g.l; (linhas[k] ||= {l:g.l, n:0}).n += g.i.length; });
  const ordem = Object.keys(linhas).sort((a,b)=>linhas[a].l.localeCompare(linhas[b].l,'pt-BR'));
  if(est.linha && !noMarca.some(g=>g.l===est.linha)) est.linha='';
  const mostrarLinhas = !!est.marca;
  const botaoLinha = (l, n, m='') => `<button data-l="${esc(l)}"${m?` data-mm="${m}"`:''} aria-pressed="${est.linha===l && !!est.marca}">${esc(l)}<span>${fmtN(n)}</span></button>`;
  if(mostrarLinhas){
    $('#linhas').innerHTML = `<button data-l="" aria-pressed="${!est.linha}">Todas as linhas</button>` + ordem.map(k => botaoLinha(linhas[k].l, linhas[k].n)).join('');
  }else{
    $('#linhas').innerHTML = Object.keys(CAT.rotulos).map(m => {
      const ks = ordem.filter(k => k.startsWith(m+'|'));
      return ks.length ? `<h2 style="color:var(${cores[m]})">${esc(CAT.rotulos[m])}</h2>` + ks.map(k => botaoLinha(linhas[k].l, linhas[k].n, m)).join('') : '';
    }).join('');
  }
  $('#seletor').style.display = mostrarLinhas ? '' : 'none';
  $('#seletor').innerHTML = '<option value="">Todas as linhas</option>' + ordem.map(k => `<option value="${esc(linhas[k].l)}"${est.linha===linhas[k].l?' selected':''}>${esc(linhas[k].l)} (${fmtN(linhas[k].n)})</option>`).join('');

  const lista = noMarca.filter(g => !est.linha || g.l === est.linha);
  const totalImg = lista.reduce((s,g)=>s+g.i.length,0);
  $('#n-img').textContent = fmtN(totalImg);
  $('#n-rot').textContent = totalImg === 1 ? 'imagem' : 'imagens';

  if(!lista.length){
    $('#resultado').innerHTML = `<div class="vazio"><b>Nada encontrado${est.q?' para “'+esc(est.q)+'”':''}.</b>Tente só o nome do produto ou limpe a busca e os filtros.<br><button id="limpar">Limpar busca e filtros</button></div>`;
    return;
  }
  let html = '', atual = null;
  lista.forEach(g => {
    if(!est.marca && g.m !== atual){
      if(atual !== null) html += '</div>';
      html += `<h2 class="marca-tit" style="color:var(${cores[g.m]})">${esc(CAT.rotulos[g.m])}</h2><div class="folha">`;
      atual = g.m;
    }else if(atual === null){ html += '<div class="folha">'; atual = g.m; }
    html += cardHtml(g);
  });
  html += '</div>';
  $('#resultado').innerHTML = html;
}

function cardHtml(g){
  const i0 = g.i[0];
  const n = g.i.length;
  const selo = g.v === 'antigo' ? '<span class="selo velho">Antiga</span> ' : g.v ? `<span class="selo">${esc(g.v)}</span> ` : '';
  const ticks = n > 1 ? `<span class="ticks">${g.i.slice(0,24).map((_,k)=>`<i class="${k===0?'on':''}"></i>`).join('')}</span>` : '';
  return `<button class="card" data-p="${esc(g.p)}" style="--c:var(${cores[g.m]})">
    <span class="foto"><img src="${esc(mini(g,i0))}" alt="" loading="lazy" decoding="async">${ticks}</span>
    <span class="nome">${esc(g.n)}</span>
    <span class="info">${selo}${n} ${n===1?'imagem':'imagens'}</span>
  </button>`;
}

const grupoDe = p => CAT.grupos.find(g => g.p === p);

/* mover o mouse sobre a foto passa pelos angulos do produto */
document.addEventListener('pointermove', e => {
  if(e.pointerType === 'touch') return;
  const foto = e.target.closest?.('.card .foto'); if(!foto) return;
  const card = foto.parentElement, g = grupoDe(card.dataset.p); if(!g || g.i.length < 2) return;
  const r = foto.getBoundingClientRect();
  const n = Math.min(g.i.length, 24);
  const k = Math.max(0, Math.min(n-1, Math.floor((e.clientX - r.left) / r.width * n)));
  if(foto.dataset.k == k) return;
  foto.dataset.k = k;
  $('img', foto).src = mini(g, g.i[k]);
  foto.querySelectorAll('.ticks i').forEach((t,j)=>t.classList.toggle('on', j===k));
});
document.addEventListener('pointerout', e => {
  const foto = e.target.closest?.('.card .foto');
  if(!foto || foto.contains(e.relatedTarget)) return;
  const g = grupoDe(foto.parentElement.dataset.p); if(!g) return;
  foto.dataset.k = 0; $('img', foto).src = mini(g, g.i[0]);
  foto.querySelectorAll('.ticks i').forEach((t,j)=>t.classList.toggle('on', j===0));
});

/* painel */
let pn = {g:null, k:0};
function abrir(p, empurrar=true){
  const g = grupoDe(p); if(!g) return;
  pn = {g, k:0};
  desenharPainel();
  const d = $('#painel'); if(!d.open) d.showModal();
  d.scrollTop = 0;
  if(empurrar) history.replaceState(null,'','#p='+encodeURIComponent(p));
}
function fechar(){ $('#painel').close(); }
$('#painel').addEventListener('close', () => history.replaceState(null,'',location.pathname+location.search));
$('#painel').addEventListener('click', e => { if(e.target === e.currentTarget) fechar(); });

function desenharPainel(){
  const {g} = pn, n = g.i.length;
  const velho = g.v === 'antigo';
  $('#pn').style.setProperty('--marca', `var(${cores[g.m]})`);
  $('#pn').innerHTML = `
  <div class="pn-topo">
    <div><h2 id="pn-tit">${esc(g.n)}</h2><p>${esc(CAT.rotulos[g.m])}${g.v && !velho ? ', versão '+esc(g.v) : ''}, ${n} ${n===1?'imagem':'imagens'}</p></div>
    <button class="fechar" data-acao="fechar">Fechar</button>
  </div>
  ${velho ? '<div class="aviso">Embalagem antiga. Não use em materiais novos nem no site sem confirmar com a Criação.</div>' : ''}
  <div class="palco"><img id="palco-img" alt=""></div>
  ${n>1 ? `<div class="tiras" id="tiras">${g.i.map((it,k)=>`<button data-k="${k}" aria-label="Imagem ${k+1} de ${n}"><img src="${esc(mini(g,it))}" alt="" loading="lazy"></button>`).join('')}</div>`:'<div style="height:10px"></div>'}
  <div class="acoes" id="acoes"></div>
  ${n>1 ? `<div class="todas">
    <h3 class="sr">Todas as imagens deste produto</h3>
    <div class="btns">
      <button class="btn" data-acao="todos-orig">Baixar todas em alta<small>${n} arquivos, um por vez</small></button>
      <button class="btn" data-acao="zip">Baixar .zip para site<small>${n} imagens em 1600 px</small></button>
      <button class="btn" data-acao="links">Copiar todos os links<small>Um link por linha</small></button>
    </div>
  </div>`:''}`;
  mostrarImagem(0);
}
function mostrarImagem(k){
  const {g} = pn; pn.k = k; const it = g.i[k];
  const img = $('#palco-img'); img.src = mini(g,it); const alta = new Image(); alta.onload = () => { if(pn.k===k && pn.g===g) img.src = alta.src; }; alta.src = site(g,it);
  img.alt = `${g.n}, imagem ${k+1}`;
  document.querySelectorAll('#tiras button').forEach((b,j)=>{ b.setAttribute('aria-current', j===k); if(j===k) b.scrollIntoView({block:'nearest',inline:'nearest'}); });
  const ext = it.a.split('.').pop().toUpperCase();
  const oext = (it.of||'').toUpperCase();
  const dim = it.w ? `${it.w} px` : '';
  $('#acoes').innerHTML = `<h3>${esc(it.a.replace(/\.[^.]+$/,''))}</h3><div class="btns">
    ${it.o ? `<a class="btn forte" href="${esc(it.o)}" rel="noopener">Baixar original<small>${oext} ${dim}, ${fmtB(it.ob)}</small></a>`:''}
    <a class="btn" href="${esc(site(g,it))}" download="${esc(it.a)}">Baixar para site<small>${ext} 1600 px, ${fmtB(it.b)}</small></a>
    <button class="btn" data-acao="link">Copiar link<small>Para usar no site</small></button>
  </div>`;
}
async function copiar(t, msg){
  try{ await navigator.clipboard.writeText(t); aviso(msg); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; $('#painel').append(a); a.select(); document.execCommand('copy'); a.remove(); aviso(msg); }
}
function baixarOriginais(g){
  const lista = g.i.filter(it=>it.o);
  lista.forEach((it,k)=>setTimeout(()=>{ const f=document.createElement('iframe'); f.hidden=true; f.src=it.o; document.body.append(f); setTimeout(()=>f.remove(),120000); }, k*900));
  aviso(`Baixando ${lista.length} arquivos. Se o navegador perguntar, permita vários downloads.`);
}
async function baixarZip(g, btn){
  btn.disabled = true; const small = $('small',btn), antes = small.textContent;
  try{
    if(!window.JSZip) await new Promise((ok,er)=>{const s=document.createElement('script');s.src='vendor/jszip.min.js';s.onload=ok;s.onerror=er;document.head.append(s)});
    const z = new JSZip();
    for(let k=0;k<g.i.length;k++){
      small.textContent = `Preparando ${k+1} de ${g.i.length}`;
      const r = await fetch(site(g,g.i[k])); if(!r.ok) throw 0;
      z.file(g.i[k].a, await r.blob());
    }
    small.textContent = 'Compactando';
    const blob = await z.generateAsync({type:'blob',compression:'STORE'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = g.p.split('/').pop() + '.zip'; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    aviso('.zip baixado');
  }catch(e){ aviso('O .zip não foi gerado. Verifique a conexão e tente de novo.'); }
  btn.disabled = false; small.textContent = antes;
}
$('#pn').addEventListener('click', e => {
  const t = e.target.closest('[data-k],[data-acao]'); if(!t) return;
  if(t.dataset.k !== undefined) return mostrarImagem(+t.dataset.k);
  const {g,k} = pn;
  const a = t.dataset.acao;
  if(a==='fechar') fechar();
  if(a==='link') copiar(abs(site(g,g.i[k])), 'Link copiado');
  if(a==='links') copiar(g.i.map(it=>abs(site(g,it))).join('\n'), `${g.i.length} links copiados`);
  if(a==='todos-orig') baixarOriginais(g);
  if(a==='zip') baixarZip(g,t);
});
function abrirDoHash(){
  const m = location.hash.match(/^#p=(.+)$/);
  if(m) abrir(decodeURIComponent(m[1]), false);
}

/* eventos */
$('#q').addEventListener('input', e => { est.q = e.target.value; render(); });
$('#antigas').addEventListener('change', e => { est.antigas = e.target.checked; render(); });
$('#marcas').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; est.marca=b.dataset.m; est.linha=''; render(); });
$('#linhas').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; if(b.dataset.mm) est.marca=b.dataset.mm; est.linha=b.dataset.l; render(); window.scrollTo({top:0}); });
$('#seletor').addEventListener('change', e => { est.linha=e.target.value; render(); });
$('#resultado').addEventListener('click', e => {
  if(e.target.closest('#limpar')){ est={q:'',marca:'',linha:'',antigas:est.antigas}; $('#q').value=''; render(); return; }
  const c=e.target.closest('.card'); if(c) abrir(c.dataset.p);
});
document.addEventListener('keydown', e => {
  const d=$('#painel');
  if(d.open && pn.g && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const n=pn.g.i.length; mostrarImagem((pn.k+(e.key==='ArrowRight'?1:n-1))%n); e.preventDefault(); return; }
  if(e.key==='/' && !d.open && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', abrirDoHash);
carregar();
</script>
