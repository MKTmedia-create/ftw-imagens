<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ECEEF1">
<meta name="description" content="Banco de imagens de produto FTW Suplementos">
<title>Banco de Imagens FTW Suplementos</title>
<style>
@font-face{font-family:Archivo;src:url(vendor/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(vendor/plexmono.woff2) format('woff2');font-weight:500;font-display:swap}
:root{
  --fundo:#ECEEF1;--core:#fff;--tinta:#101114;--apoio:#555C66;
  --tray:rgba(16,17,20,.045);--anel:rgba(16,17,20,.075);--anel-forte:rgba(16,17,20,.14);
  --ftw:#DA291C;--dv:#0B7A34;--del:#A9500B;--ace:#3C4450;--marca:var(--tinta);
  --aviso-fundo:#FFF3D1;--aviso-tinta:#5B4300;
  --mola:cubic-bezier(.32,.72,0,1);
  --sombra:0 30px 60px -38px rgba(16,17,20,.28);
  --r-g:34px;--r-m:24px;--bezel:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--fundo);color:var(--tinta);font:400 16px/1.5 Archivo,system-ui,sans-serif;font-stretch:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2.5px solid var(--marca);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.cod{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:.875em;letter-spacing:-.01em}

/* ilha de navegacao */
.ilha{position:fixed;z-index:20;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;max-width:calc(100vw - 24px);padding:6px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 0 0 1px var(--anel),0 18px 40px -24px rgba(16,17,20,.35)}
.logo{padding:0 14px 0 14px;font-size:15px;font-weight:800;font-stretch:80%;white-space:nowrap;letter-spacing:-.005em}
.marcas{display:flex;gap:2px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.marcas::-webkit-scrollbar{display:none}
.marcas button{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .4s var(--mola),color .4s var(--mola)}
.marcas button span{font-weight:400;color:var(--apoio);font-variant-numeric:tabular-nums;transition:color .4s var(--mola)}
.marcas button:hover{background:var(--tray)}
.marcas button[aria-pressed=true]{background:var(--marca);color:#fff}
.marcas button[aria-pressed=true] span{color:#ffffffc9}

/* busca */
.topo{max-width:1560px;margin:0 auto;padding:104px 32px 0}
.bezel{padding:var(--bezel);border-radius:var(--r-g);background:var(--tray);box-shadow:0 0 0 1px var(--anel)}
.busca{display:flex;align-items:center;gap:20px;padding:14px 30px 14px 30px;border-radius:calc(var(--r-g) - var(--bezel));background:var(--core);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),var(--sombra);cursor:text}
.busca>svg{width:clamp(26px,3.6vw,50px);height:clamp(26px,3.6vw,50px);stroke-width:1;color:var(--apoio)}
.busca input{flex:1;min-width:0;border:0;background:none;outline:0;padding:0;font-size:clamp(30px,6vw,92px);line-height:1.12;font-weight:800;font-stretch:66%;letter-spacing:-.012em}
.busca input::placeholder{color:#A5ABB4;opacity:1}
.busca input::-webkit-search-cancel-button{display:none}
.conta{flex:none;text-align:right;white-space:nowrap;color:var(--apoio);font-size:14px;line-height:1.2}
.conta b{display:block;color:var(--tinta);font-size:clamp(22px,2.6vw,38px);line-height:1;font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums}
.meta{margin:12px 6px 0;color:var(--apoio);font-size:14px}

/* corpo */
.corpo{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:272px minmax(0,1fr);gap:0 28px;padding:28px 32px 96px;align-items:start}
.lateral{position:sticky;top:76px}
.lateral .nucleo{display:flex;flex-direction:column;max-height:calc(100dvh - 96px);border-radius:calc(var(--r-m) - var(--bezel));background:var(--core);box-shadow:inset 0 1px 1px rgba(255,255,255,.9)}
.lateral.bezel{border-radius:var(--r-m)}
.linhas{overflow:auto;padding:8px;scrollbar-width:thin}
.linhas h2{margin:14px 10px 4px;font-size:21px;line-height:1.1;font-weight:800;font-stretch:66%}
.linhas h2:first-child{margin-top:6px}
.linhas button{display:flex;width:100%;justify-content:space-between;gap:10px;min-height:34px;padding:6px 10px;border:0;border-radius:12px;background:none;text-align:left;font-size:14px;line-height:1.28;transition:background .35s var(--mola)}
.linhas button span{color:var(--apoio);font-variant-numeric:tabular-nums}
.linhas button:hover{background:var(--tray)}
.linhas button[aria-pressed=true]{background:var(--tinta);color:#fff;font-weight:600}
.linhas button[aria-pressed=true] span{color:#ffffffc9}
.seletor{display:none;width:100%;height:46px;padding:0 14px;border:0;border-radius:16px;background:var(--core);box-shadow:0 0 0 1px var(--anel);margin-bottom:10px}
.moveis{display:none}

/* folha de produtos */
.bloco+.bloco{margin-top:72px}
.bloco-tit{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 6px 18px}
.bloco-tit h2{margin:0;font-size:clamp(38px,5vw,76px);line-height:1;font-weight:800;font-stretch:64%;letter-spacing:-.012em}
.bloco-tit span{color:var(--apoio);font-size:14px;white-space:nowrap}
.folha{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));grid-auto-flow:dense;gap:14px}
.card{display:flex;flex-direction:column;width:100%;padding:var(--bezel);border:0;border-radius:var(--r-m);background:var(--tray);box-shadow:0 0 0 1px var(--anel);text-align:left;transition:transform .7s var(--mola),box-shadow .7s var(--mola),background .7s var(--mola)}
.card:hover{transform:translateY(-3px);background:rgba(16,17,20,.06);box-shadow:0 0 0 1px var(--anel-forte),var(--sombra)}
.card:active{transform:scale(.985)}
.foto{position:relative;display:block;width:100%;aspect-ratio:1;flex:0 0 auto;border-radius:calc(var(--r-m) - var(--bezel));background:var(--core);box-shadow:inset 0 1px 1px rgba(255,255,255,.9);overflow:hidden}
.foto img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;transition:transform .9s var(--mola)}
.card:hover .foto img{transform:scale(1.035)}
.ticks{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:3px;height:2px}
.ticks i{flex:1;border-radius:2px;background:rgba(16,17,20,.1);transition:background .25s var(--mola)}
.ticks i.on{background:var(--c,var(--tinta))}
.txt{display:block;padding:10px 8px 8px}
.nome{display:block;font-size:17px;line-height:1.14;font-weight:700;font-stretch:78%}
.info{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-size:13px;line-height:1.3;color:var(--apoio)}
.selo{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;background:var(--core);color:var(--tinta);box-shadow:0 0 0 1px var(--anel)}
.selo.velho{background:var(--aviso-fundo);color:var(--aviso-tinta);box-shadow:none}
.selo.fora{background:transparent;color:var(--apoio)}
.card.lider{grid-column:span 2;grid-row:span 2}
.card.lider .foto{flex:1 1 auto}
.card.lider .nome{font-size:clamp(24px,2.2vw,32px);line-height:1.04;font-weight:800;font-stretch:68%}
.card.lider .txt{padding:14px 12px 10px}
.vazio{padding:56px 6px;max-width:48ch;font-size:18px}
.vazio b{display:block;font-size:44px;line-height:1.05;font-weight:800;font-stretch:66%;margin-bottom:10px}
.vazio button{margin-top:18px;height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--tinta);color:#fff;font-weight:600}
.oculto{opacity:0;transform:translateY(14px)}
.revela{transition:opacity .8s var(--mola),transform .9s var(--mola),box-shadow .7s var(--mola),background .7s var(--mola)}

/* painel */
dialog{position:fixed;inset:12px 12px 12px auto;margin:0;padding:var(--bezel);width:min(820px,calc(100vw - 24px));max-width:none;height:calc(100dvh - 24px);max-height:none;border:0;border-radius:var(--r-g);background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.5),0 50px 90px -40px rgba(16,17,20,.55);color:var(--tinta);overflow:hidden}
dialog:focus,dialog:focus-visible{outline:none}
dialog[open]{animation:entra .62s var(--mola)}
dialog.sai{animation:sai .26s cubic-bezier(.4,0,1,1) forwards}
dialog::backdrop{background:rgba(16,17,20,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .4s var(--mola)}
dialog.sai::backdrop{opacity:0;transition:opacity .26s}
@keyframes entra{from{transform:translateX(56px);opacity:0}to{transform:none;opacity:1}}
@keyframes sai{to{transform:translateX(36px);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pn{display:flex;flex-direction:column;height:100%;overflow:auto;border-radius:calc(var(--r-g) - var(--bezel));background:var(--core);scrollbar-width:thin}
.pn-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 26px 12px}
.selo-marca{display:inline-block;margin-bottom:8px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--marca)}
.pn-topo h2{margin:0;font-size:clamp(30px,4vw,48px);line-height:1;font-weight:800;font-stretch:64%;letter-spacing:-.008em}
.redondo{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--tray);transition:background .4s var(--mola),transform .5s var(--mola)}
.redondo:hover{background:var(--anel-forte);transform:rotate(90deg)}
.aviso{margin:0 26px 12px;padding:10px 14px;border-radius:14px;background:var(--aviso-fundo);color:var(--aviso-tinta);font-size:14px}
.palco{margin:0 26px;height:min(44vh,440px);flex:none;background:var(--core)}
.palco img{width:100%;height:100%;object-fit:contain;display:block}
.tiras{display:flex;gap:8px;overflow-x:auto;padding:12px 26px;scrollbar-width:thin;flex:none}
.tiras button{flex:none;width:64px;height:64px;padding:0;border:0;border-radius:14px;background:var(--core);box-shadow:0 0 0 1px var(--anel);overflow:hidden;transition:box-shadow .35s var(--mola)}
.tiras button img{width:100%;height:100%;object-fit:contain;display:block}
.tiras button[aria-current=true]{box-shadow:0 0 0 2px var(--marca)}
.acoes{padding:2px 26px 18px}
.arq{margin:0 0 10px;color:var(--apoio);font-size:13px;overflow-wrap:anywhere}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px 6px 18px;border:0;border-radius:999px;background:var(--tray);color:var(--tinta);text-decoration:none;font-size:15px;font-weight:600;line-height:1.15;transition:transform .5s var(--mola),background .4s var(--mola)}
.pill>span:first-child{text-align:left}
.pill small{display:block;font-weight:400;font-size:12.5px;color:var(--apoio)}
.pill .gota{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(16,17,20,.07);transition:transform .6s var(--mola)}
.pill:hover{background:var(--anel-forte)}
.pill:hover .gota{transform:translateY(2px) scale(1.06)}
.pill:active{transform:scale(.98)}
.pill.forte{background:var(--tinta);color:#fff}
.pill.forte small{color:#ffffffc9}
.pill.forte .gota{background:rgba(255,255,255,.16)}
.pill.forte:hover{background:#2A2C31}
.pill[disabled]{opacity:.6;cursor:progress}
.ficha{margin:0 26px 18px;padding:var(--bezel);border-radius:var(--r-m);background:var(--tray);box-shadow:0 0 0 1px var(--anel)}
.ficha dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:calc(var(--r-m) - var(--bezel));background:var(--core);overflow:hidden}
.ficha div{padding:12px 16px;min-width:0;box-shadow:0 0 0 .5px var(--anel)}
.ficha div.larga{grid-column:1/-1}
.ficha dt{font-size:12.5px;color:var(--apoio)}
.ficha dd{margin:2px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.mini{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:-4px -6px -4px 0;border:0;border-radius:50%;background:none;transition:background .35s var(--mola)}
.mini svg.i{width:16px;height:16px}
.mini:hover{background:var(--tray)}
.todas{margin-top:auto;padding:14px 26px 24px;box-shadow:0 -1px 0 var(--anel)}
.todas p{margin:0 0 10px;font-size:13px;color:var(--apoio)}
.toast{position:fixed;left:50%;bottom:26px;z-index:30;transform:translate(-50%,16px);padding:10px 18px;border-radius:999px;background:var(--tinta);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .35s var(--mola),transform .5s var(--mola)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1040px){
  .logo{display:none}
  .ilha{left:12px;right:12px;transform:none;max-width:none}
  .marcas{flex:1;min-width:0}
  .corpo{display:block;padding:18px 16px 72px}
  .lateral{display:none}
  .topo{padding:78px 16px 0}
  .busca{padding:10px 18px;gap:12px}
  .moveis{display:block;margin-bottom:18px}
  .seletor{display:block}
  .marcas button{height:44px}
  .folha{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .bloco+.bloco{margin-top:52px}
  .nome{font-size:16px}
  :root{--r-g:28px;--r-m:20px;--bezel:5px}
  dialog{inset:0;width:100vw;height:100dvh;border-radius:0;padding:0}
  .pn{border-radius:0}
  .pn-topo,.tiras,.acoes,.todas{padding-left:16px;padding-right:16px}
  .palco,.ficha,.aviso{margin-left:16px;margin-right:16px}
  .palco{height:44vh}
  .pill{flex:1 1 100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .oculto{opacity:1;transform:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.6-4.6"/></symbol>
  <symbol id="i-baixar" viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5M5 20h14"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.500 4h-6A2.500 2.500 0 0 0 4 6.500v6A2.500 2.500 0 0 0 6.500 15H9"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</defs></svg>

<nav class="ilha" aria-label="Marcas">
  <span class="logo">Banco de imagens</span>
  <ul class="marcas" id="marcas"></ul>
</nav>

<header class="topo">
  <h1 class="sr">Banco de imagens FTW Suplementos</h1>
  <div class="bezel">
    <label class="busca">
      <svg class="i"><use href="#i-busca"/></svg>
      <span class="sr">Buscar por produto, sabor, EAN ou PA</span>
      <input id="q" type="search" placeholder="Produto, sabor, EAN ou PA" autocomplete="off" spellcheck="false" autofocus>
      <span class="conta" aria-live="polite"><b id="n-img">0</b><span id="n-rot">imagens</span></span>
    </label>
  </div>
  <p class="meta" id="atualizado"></p>
</header>

<main class="corpo">
  <aside class="lateral bezel" aria-label="Filtros">
    <div class="nucleo">
      <nav class="linhas" id="linhas" aria-label="Linhas de produto"></nav>
    </div>
  </aside>
  <div>
    <div class="moveis">
      <label class="sr" for="seletor">Linha de produto</label>
      <select class="seletor" id="seletor"></select>
    </div>
    <div id="resultado"></div>
  </div>
</main>
<dialog id="painel" aria-labelledby="pn-tit"><div class="pn" id="pn"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const icone = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const cores = {FTW:'--ftw', DiaboVerde:'--dv', Delicious:'--del', Acessorios:'--ace'};
const fmtN = n => n.toLocaleString('pt-BR');
const fmtB = b => !b ? '' : b >= 1e6 ? (b/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' MB' : Math.round(b/1e3) + ' KB';
const site = (g, it) => `produtos/${g.p}/${it.a}`;
const mini = (g, it) => `miniaturas/${g.p}/${it.a.replace(/\.[^.]+$/, '')}.webp`;
const abs = rel => new URL(rel, location.href).href;
const plural = n => n === 1 ? 'imagem' : 'imagens';
let CAT, est = {q:'', marca:'', linha:''}, animar = true;

function aviso(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(aviso.t);aviso.t=setTimeout(()=>el.classList.remove('on'),2400)}

async function carregar(){
  try{
    const r = await fetch('catalogo.json', {cache:'no-cache'});
    if(!r.ok) throw 0;
    CAT = await r.json();
  }catch(e){
    $('#resultado').innerHTML = '<div class="vazio"><b>O catálogo não carregou.</b>Recarregue a página. Se continuar, avise o time de Criação.</div>';
    return;
  }
  CAT.grupos.forEach(g => g.busca = sem([g.n, g.l, CAT.rotulos[g.m], g.p.replace(/[_/-]/g,' '), g.v, g.pa, g.ean, g.dun, g.ds].join(' ')));
  const d = new Date(CAT.gerado);
  $('#atualizado').textContent = `${fmtN(CAT.grupos.length)} produtos e variações. Atualizado em ${d.toLocaleDateString('pt-BR')}, às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`;
  render();
  abrirDoHash();
}

const visiveis = () => {
  const toks = sem(est.q).split(/\s+/).filter(Boolean);
  return CAT.grupos.filter(g => g.v !== 'antigo' && toks.every(t => g.busca.includes(t)));
};

function render(){
  const base = visiveis();
  const porMarca = {}; base.forEach(g => porMarca[g.m] = (porMarca[g.m]||0) + g.i.length);
  const contaTotal = base.reduce((s,g) => s + g.i.length, 0);
  const marcas = [['', 'Todas', contaTotal], ...Object.keys(CAT.rotulos).map(m => [m, CAT.rotulos[m], porMarca[m]||0])];
  $('#marcas').innerHTML = marcas.map(([m,r,n]) => `<li><button data-m="${m}" aria-pressed="${est.marca===m}">${esc(r)}<span>${fmtN(n)}</span></button></li>`).join('');
  document.documentElement.style.setProperty('--marca', est.marca ? `var(${cores[est.marca]})` : 'var(--tinta)');

  const noMarca = base.filter(g => !est.marca || g.m === est.marca);
  const linhas = {}; noMarca.forEach(g => { const k = g.m+'|'+g.l; (linhas[k] ||= {m:g.m,l:g.l,n:0}).n += g.i.length; });
  const ordem = Object.values(linhas).sort((a,b)=>a.l.localeCompare(b.l,'pt-BR'));
  if(est.linha && !noMarca.some(g=>g.l===est.linha)) est.linha='';
  const botao = x => `<button data-l="${esc(x.l)}" data-mm="${x.m}" aria-pressed="${est.linha===x.l}">${esc(x.l)}<span>${fmtN(x.n)}</span></button>`;
  $('#linhas').innerHTML = (est.marca
    ? `<button data-l="" data-mm="${est.marca}" aria-pressed="${!est.linha}">Todas as linhas</button>` + ordem.map(botao).join('')
    : Object.keys(CAT.rotulos).map(m => { const ls = ordem.filter(x=>x.m===m); return ls.length ? `<h2 style="color:var(${cores[m]})">${esc(CAT.rotulos[m])}</h2>` + ls.map(botao).join('') : ''; }).join(''));
  $('#seletor').innerHTML = '<option value="">Todas as linhas</option>' + ordem.map(x => `<option value="${esc(x.m+'|'+x.l)}"${est.linha===x.l?' selected':''}>${esc(x.l)} (${fmtN(x.n)})</option>`).join('');

  const lista = noMarca.filter(g => !est.linha || g.l === est.linha);
  const totalImg = lista.reduce((s,g)=>s+g.i.length,0);
  $('#n-img').textContent = fmtN(totalImg);
  $('#n-rot').textContent = plural(totalImg);

  if(!lista.length){
    $('#resultado').innerHTML = `<div class="vazio"><b>Nada encontrado${est.q?' para “'+esc(est.q)+'”':''}.</b>Tente só o nome do produto, o EAN completo ou limpe os filtros.<br><button id="limpar">Limpar busca e filtros</button></div>`;
    return;
  }
  const blocos = {};
  lista.forEach(g => (blocos[g.m] ||= []).push(g));
  $('#resultado').innerHTML = Object.keys(blocos).map(m => {
    const gs = blocos[m], tot = gs.reduce((s,g)=>s+g.i.length,0);
    const cont = {}; gs.forEach(g => cont[g.l] = (cont[g.l]||0)+1);
    const vistos = new Set();
    const cards = gs.map(g => { const lider = cont[g.l] >= 3 && !vistos.has(g.l); vistos.add(g.l); return cardHtml(g, lider); }).join('');
    return `<section class="bloco"><div class="bloco-tit"><h2 style="color:var(${cores[m]})">${esc(CAT.rotulos[m])}</h2><span>${fmtN(tot)} ${plural(tot)}</span></div><div class="folha">${cards}</div></section>`;
  }).join('');
  revelar();
}

function cardHtml(g, lider){
  const n = g.i.length;
  const selos = [];
  if(g.v === 'antigo') selos.push('<span class="selo velho">Antiga</span>');
  else if(g.v) selos.push(`<span class="selo">${esc(g.v)}</span>`);
  if(g.ean) selos.push(`<span class="cod">${esc(g.ean)}</span>`);
  selos.push(`<span>${n} ${plural(n)}</span>`);
  const ticks = n > 1 ? `<span class="ticks">${g.i.slice(0,24).map((_,k)=>`<i class="${k===0?'on':''}"></i>`).join('')}</span>` : '';
  return `<button class="card${lider?' lider':''}" data-p="${esc(g.p)}" style="--c:var(${cores[g.m]})">
    <span class="foto"><img src="${esc(mini(g,g.i[0]))}" alt="" loading="lazy" decoding="async">${ticks}</span>
    <span class="txt"><span class="nome">${esc(g.n)}</span><span class="info">${selos.join('')}</span></span>
  </button>`;
}

/* os cards surgem uma vez ao entrar na tela */
let obs;
function revelar(){
  if(!animar || matchMedia('(prefers-reduced-motion:reduce)').matches || !('IntersectionObserver' in window)) return;
  animar = false;
  obs?.disconnect();
  obs = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    const el = e.target; obs.unobserve(el);
    el.style.transitionDelay = (el.dataset.d||0)+'ms';
    requestAnimationFrame(()=>{ el.classList.remove('oculto'); setTimeout(()=>{el.classList.remove('revela');el.style.transitionDelay=''},1100); });
  }),{rootMargin:'0px 0px -6% 0px'});
  $$('.card').forEach((el,i)=>{ el.classList.add('revela','oculto'); el.dataset.d = Math.min(i%6*45,225); obs.observe(el); });
}

const grupoDe = p => CAT.grupos.find(g => g.p === p);

/* mover o mouse sobre a foto passa pelos angulos do produto */
document.addEventListener('pointermove', e => {
  if(e.pointerType === 'touch') return;
  const foto = e.target.closest?.('.card .foto'); if(!foto) return;
  const g = grupoDe(foto.parentElement.dataset.p); if(!g || g.i.length < 2) return;
  const r = foto.getBoundingClientRect(), n = Math.min(g.i.length, 24);
  const k = Math.max(0, Math.min(n-1, Math.floor((e.clientX - r.left) / r.width * n)));
  if(foto.dataset.k == k) return;
  foto.dataset.k = k;
  $('img', foto).src = mini(g, g.i[k]);
  $$('.ticks i', foto).forEach((t,j)=>t.classList.toggle('on', j===k));
});
document.addEventListener('pointerout', e => {
  const foto = e.target.closest?.('.card .foto');
  if(!foto || foto.contains(e.relatedTarget)) return;
  const g = grupoDe(foto.parentElement.dataset.p); if(!g) return;
  foto.dataset.k = 0; $('img', foto).src = mini(g, g.i[0]);
  $$('.ticks i', foto).forEach((t,j)=>t.classList.toggle('on', j===0));
});

/* painel */
let pn = {g:null, k:0};
const dlg = () => $('#painel');
function abrir(p, marcar=true){
  const g = grupoDe(p); if(!g) return;
  pn = {g, k:0};
  desenharPainel();
  const d = dlg(); if(!d.open) d.showModal();
  $('#pn').scrollTop = 0;
  if(marcar) history.replaceState(null,'','#p='+encodeURIComponent(p));
}
function fechar(){
  const d = dlg(); if(!d.open) return;
  d.classList.add('sai');
  setTimeout(()=>{ d.classList.remove('sai'); d.close(); }, matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 240);
}
dlg().addEventListener('close', () => history.replaceState(null,'',location.pathname+location.search));
dlg().addEventListener('click', e => { if(e.target === e.currentTarget) fechar(); });
dlg().addEventListener('cancel', e => { e.preventDefault(); fechar(); });

function linhaFicha(rotulo, valor, opts={}){
  if(!valor) return '';
  const copiar = opts.copiar ? `<button class="mini" data-copiar="${esc(valor)}" aria-label="Copiar ${esc(rotulo)}">${icone('copiar')}</button>` : '';
  return `<div class="${opts.larga?'larga':''}"><dt>${esc(rotulo)}</dt><dd><span class="${opts.cod?'cod':''}">${esc(valor)}</span>${copiar}</dd></div>`;
}
function desenharPainel(){
  const {g} = pn, n = g.i.length, velho = g.v === 'antigo';
  const P = $('#pn');
  P.style.setProperty('--marca', `var(${cores[g.m]})`);
  const conferir = g.st === 'conferir';
  const ean = g.ean || (conferir ? 'Em conferência' : g.st === 'sem_ean' ? 'Não cadastrado' : '');
  const avisos = [];
  if(velho) avisos.push('Embalagem antiga. Não use em materiais novos nem no site sem confirmar com a Criação.');
  if(conferir) avisos.push('EAN em conferência: as fontes internas divergem. Confirme antes de cadastrar.');
  if(g.tb === 'nao') avisos.push('Este produto não está na tabela comercial B2B. Confirme se segue em linha.');
  const ficha = linhaFicha('EAN', ean, {cod:!!g.ean, copiar:!!g.ean}) + linhaFicha('PA', g.pa, {cod:true, copiar:true}) + linhaFicha('DUN-14', g.dun, {cod:true, copiar:true}) + linhaFicha('Unidades por caixa', g.qc)
    + linhaFicha('Descrição na tabela', g.ds, {larga:true}) + linhaFicha('Categoria', g.ct) + linhaFicha('Caixa de embarque', g.cx, {larga:true}) + linhaFicha('NCM', g.ncm, {cod:true});
  P.innerHTML = `
  <div class="pn-topo">
    <div><span class="selo-marca">${esc(CAT.rotulos[g.m])}</span><h2 id="pn-tit">${esc(g.n)}</h2></div>
    <button class="redondo" data-acao="fechar" aria-label="Fechar">${icone('fechar')}</button>
  </div>
  ${avisos.map(a=>`<div class="aviso">${esc(a)}</div>`).join('')}
  <div class="palco"><img id="palco-img" alt=""></div>
  ${n>1 ? `<div class="tiras" id="tiras">${g.i.map((it,k)=>`<button data-k="${k}" aria-label="Imagem ${k+1} de ${n}"><img src="${esc(mini(g,it))}" alt="" loading="lazy"></button>`).join('')}</div>`:'<div style="height:12px;flex:none"></div>'}
  <div class="acoes" id="acoes"></div>
  ${ficha ? `<div class="ficha"><dl>${ficha}</dl></div>` : ''}
  ${n>1 ? `<div class="todas">
    <p>Todas as ${n} imagens deste produto</p>
    <div class="btns">
      <button class="pill" data-acao="todos-orig"><span>Baixar em alta<small>Um arquivo por vez</small></span><span class="gota">${icone('baixar')}</span></button>
      <button class="pill" data-acao="zip"><span>Baixar .zip para site<small>1600 px</small></span><span class="gota">${icone('baixar')}</span></button>
      <button class="pill" data-acao="links"><span>Copiar links<small>Um por linha</small></span><span class="gota">${icone('link')}</span></button>
    </div>
  </div>`:''}`;
  mostrarImagem(0);
}
function mostrarImagem(k){
  const {g} = pn; pn.k = k; const it = g.i[k];
  const img = $('#palco-img'); img.src = mini(g,it);
  const alta = new Image(); alta.onload = () => { if(pn.k===k && pn.g===g) img.src = alta.src; }; alta.src = site(g,it);
  img.alt = `${g.n}, imagem ${k+1}`;
  $$('#tiras button').forEach((b,j)=>{ b.setAttribute('aria-current', j===k); if(j===k) b.scrollIntoView({block:'nearest',inline:'nearest'}); });
  const ext = it.a.split('.').pop().toUpperCase(), oext = (it.of||'').toUpperCase(), dim = it.w ? `${it.w} px` : '';
  $('#acoes').innerHTML = `<p class="arq">${esc(it.dn)}</p><div class="btns">
    ${it.o ? `<a class="pill forte" href="${esc(it.o)}" rel="noopener"><span>Baixar original<small>${oext} ${dim}, ${fmtB(it.ob)}</small></span><span class="gota">${icone('baixar')}</span></a>`:''}
    <a class="pill" href="${esc(site(g,it))}" download="${esc(it.dn+'.'+ext.toLowerCase())}"><span>Baixar para site<small>${ext} 1600 px, ${fmtB(it.b)}</small></span><span class="gota">${icone('baixar')}</span></a>
    <button class="pill" data-acao="link"><span>Copiar link<small>Versão para site</small></span><span class="gota">${icone('link')}</span></button>
  </div>`;
}
async function copiar(t, msg){
  try{ await navigator.clipboard.writeText(t); aviso(msg); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; dlg().append(a); a.select(); document.execCommand('copy'); a.remove(); aviso(msg); }
}
function baixarOriginais(g){
  const lista = g.i.filter(it=>it.o);
  lista.forEach((it,k)=>setTimeout(()=>{ const f=document.createElement('iframe'); f.hidden=true; f.src=it.o; document.body.append(f); setTimeout(()=>f.remove(),120000); }, k*900));
  aviso(`Baixando ${lista.length} arquivos. Se o navegador perguntar, permita vários downloads.`);
}
async function baixarZip(g, btn){
  btn.disabled = true; const small = $('small',btn), antes = small.textContent;
  try{
    if(!window.JSZip) await new Promise((ok,er)=>{const s=document.createElement('script');s.src='vendor/jszip.min.js';s.onload=ok;s.onerror=er;document.head.append(s)});
    const z = new JSZip();
    for(let k=0;k<g.i.length;k++){
      small.textContent = `Preparando ${k+1} de ${g.i.length}`;
      const r = await fetch(site(g,g.i[k])); if(!r.ok) throw 0;
      z.file(g.i[k].dn + '.' + g.i[k].a.split('.').pop().toLowerCase(), await r.blob());
    }
    small.textContent = 'Compactando';
    const blob = await z.generateAsync({type:'blob',compression:'STORE'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = g.dz + '.zip'; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    aviso('.zip baixado');
  }catch(e){ aviso('O .zip não foi gerado. Verifique a conexão e tente de novo.'); }
  btn.disabled = false; small.textContent = antes;
}
$('#pn').addEventListener('click', e => {
  const c = e.target.closest('[data-copiar]'); if(c) return copiar(c.dataset.copiar, 'Código copiado');
  const t = e.target.closest('[data-k],[data-acao]'); if(!t) return;
  if(t.dataset.k !== undefined) return mostrarImagem(+t.dataset.k);
  const {g,k} = pn, a = t.dataset.acao;
  if(a==='fechar') fechar();
  if(a==='link') copiar(abs(site(g,g.i[k])), 'Link copiado');
  if(a==='links') copiar(g.i.map(it=>abs(site(g,it))).join('\n'), `${g.i.length} links copiados`);
  if(a==='todos-orig') baixarOriginais(g);
  if(a==='zip') baixarZip(g,t);
});
function abrirDoHash(){
  const m = location.hash.match(/^#p=(.+)$/);
  if(m) abrir(decodeURIComponent(m[1]), false);
}

/* eventos */
let tBusca;
$('#q').addEventListener('input', e => { clearTimeout(tBusca); tBusca = setTimeout(()=>{ est.q = e.target.value; render(); }, 90); });
$('#marcas').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; est.marca=b.dataset.m; est.linha=''; animar=true; render(); });
$('#linhas').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; if(b.dataset.mm) est.marca=b.dataset.mm; est.linha=b.dataset.l; animar=true; render(); scrollTo({top:$('.corpo').offsetTop-70}); });
$('#seletor').addEventListener('change', e => { const v=e.target.value; if(v){const [m,l]=v.split('|'); est.marca=m; est.linha=l;} else est.linha=''; render(); });
$('#resultado').addEventListener('click', e => {
  if(e.target.closest('#limpar')){ est={q:'',marca:'',linha:''}; $('#q').value=''; render(); return; }
  const c=e.target.closest('.card'); if(c) abrir(c.dataset.p);
});
document.addEventListener('keydown', e => {
  const d=dlg();
  if(d.open && pn.g && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const n=pn.g.i.length; mostrarImagem((pn.k+(e.key==='ArrowRight'?1:n-1))%n); e.preventDefault(); return; }
  if(e.key==='/' && !d.open && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', abrirDoHash);
if(matchMedia('(max-width:640px)').matches) $('#q').placeholder = 'Produto, EAN ou PA';
carregar();
</script>
